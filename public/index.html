<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TipDrop</title>
<meta name="description" content="Send crypto tips and payment requests as links on BNB Chain, Solana, Base, Arbitrum, Polygon and Ethereum. Claiming is free.">
<meta name="theme-color" content="#0C0D13">
<meta name="color-scheme" content="dark">

<!-- icons -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/logo-transparent.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- link previews (Telegram, WhatsApp, X). For best results replace "/og-image.png" with your full URL, e.g. https://tipdrop.netlify.app/og-image.png -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="TipDrop">
<meta property="og:title" content="TipDrop · crypto tips as a link">
<meta property="og:description" content="Someone can send you crypto with just a link. Open it, paste your address, claim. No sign-up.">
<meta property="og:image" content="/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TipDrop · crypto tips as a link">
<meta name="twitter:description" content="Open it, paste your address, claim. No sign-up.">
<meta name="twitter:image" content="/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grain"></div>

<header class="bar">
  <a class="brand" href="#" id="brandLink">
    <img class="brand-mark" src="/logo.png" alt="" width="30" height="30">
    <span id="brandName">TipDrop</span>
  </a>
  <nav class="nav" aria-label="Main">
    <button type="button" data-nav="create">Send</button>
    <button type="button" data-nav="request">Request</button>
    <button type="button" data-nav="mytips">My links<span class="count" id="tipCount" hidden></span></button>
    <button type="button" data-nav="token">$TDP</button>
  </nav>
  <button class="wallet-btn" id="walletBtn" type="button">Connect</button>
</header>

<main id="app"><noscript><div class="card"><h2>Turn on JavaScript</h2><p class="fine">TipDrop runs in your browser and needs JavaScript to create and claim tips.</p></div></noscript></main>

<footer>
  <nav class="foot-links" aria-label="Community">
    <a href="#token">TDP token</a><a href="https://x.com/TipDropPro" target="_blank" rel="noopener">X</a><a href="https://t.me/TipDropPro" target="_blank" rel="noopener">Telegram</a><a href="https://t.me/TipDropGroup" target="_blank" rel="noopener">Chat</a><a href="https://www.tiktok.com/@tipdropzz" target="_blank" rel="noopener">TikTok</a>
  </nav>
  <span>BNB Chain · Solana · Base · Arbitrum · Polygon · Ethereum</span><span>Keys stay in your browser</span><span>Free to claim</span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/js/config.js"></script>
<script src="/js/solana.js"></script>
<script src="/js/token.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
